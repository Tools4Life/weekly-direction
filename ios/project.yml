name: WeeklyDirection
options:
  bundleIdPrefix: com.redeemedtools
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  WeeklyDirection:
    type: application
    platform: iOS
    sources:
      - path: WeeklyDirection
    resources:
      - path: WeeklyDirection/GoogleService-Info.plist
        optional: true
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redeemedtools.WeeklyDirection
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Weekly Direction
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Weekly Direction records your spoken reflections and turns them into journal entries.
        CODE_SIGN_STYLE: Automatic
