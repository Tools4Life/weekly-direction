name: WeeklyDirection
options:
  bundleIdPrefix: com.redeemedtools
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  WeeklyDirection:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - WeeklyDirectionTests
    sources:
      - path: WeeklyDirection
      - path: Shared
    entitlements:
      path: WeeklyDirection/WeeklyDirection.entitlements
      properties:
        com.apple.security.application-groups: [group.com.redeemedtools.WeeklyDirection]
    info:
      path: WeeklyDirection/Info.plist
      properties:
        CFBundleDisplayName: Weekly Direction
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.redeemedtools.WeeklyDirection
            CFBundleURLSchemes: [weeklydirection]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Weekly Direction records your spoken reflections and turns them into journal entries.
        NSSpeechRecognitionUsageDescription: Weekly Direction shows your words on screen while you record a reflection.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: reflect
            UIApplicationShortcutItemTitle: Reflect
            UIApplicationShortcutItemIconSymbolName: mic
        UIAppFonts:
          - Fraunces.ttf
          - Fraunces-Italic.ttf
          - Barlow-Regular.ttf
          - Barlow-Medium.ttf
          - Barlow-SemiBold.ttf
          - BarlowCondensed-Medium.ttf
          - BarlowCondensed-SemiBold.ttf
    resources:
      - path: WeeklyDirection/GoogleService-Info.plist
        optional: true
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - target: WeeklyDirectionWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redeemedtools.WeeklyDirection
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Weekly Direction
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Weekly Direction records your spoken reflections and turns them into journal entries.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DZJE34VW29
  # Home / Lock Screen widgets, the timer Live Activity (Dynamic Island) and the Dictate control. Reads the week from the
  # App Group; no Firebase. Keep its version settings equal to the app's (TestFlight rejects a mismatch).
  WeeklyDirectionWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WeeklyDirectionWidgets
      - path: Shared
      - path: WeeklyDirection/Fonts
        buildPhase: resources
        excludes: ["*.txt"]
    entitlements:
      path: WeeklyDirectionWidgets/WeeklyDirectionWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.redeemedtools.WeeklyDirection]
    info:
      path: WeeklyDirectionWidgets/Info.plist
      properties:
        CFBundleDisplayName: Weekly Direction
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Fraunces.ttf
          - Fraunces-Italic.ttf
          - Barlow-Regular.ttf
          - Barlow-Medium.ttf
          - Barlow-SemiBold.ttf
          - BarlowCondensed-Medium.ttf
          - BarlowCondensed-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redeemedtools.WeeklyDirection.Widgets
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DZJE34VW29
        SKIP_INSTALL: YES
  WeeklyDirectionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WeeklyDirectionTests
    dependencies:
      - target: WeeklyDirection
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        PRODUCT_BUNDLE_IDENTIFIER: com.redeemedtools.WeeklyDirectionTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WeeklyDirection.app/WeeklyDirection
        BUNDLE_LOADER: $(TEST_HOST)
